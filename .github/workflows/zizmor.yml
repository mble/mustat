name: zizmor

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Inspect actions in this private repository.
      contents: read # Inspect workflow sources.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          version: "1.30.0"
